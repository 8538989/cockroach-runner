services:
  cockroach-runner:
    build: .
    image: cockroach-runner:latest
    container_name: cockroach-runner
    restart: unless-stopped
    environment:
      COCKROACH_ADMIN_USERNAME: ${COCKROACH_ADMIN_USERNAME:?请在 .env 中设置管理员用户名}
      COCKROACH_ADMIN_PASSWORD: ${COCKROACH_ADMIN_PASSWORD:?请在 .env 中设置管理员密码}
      COCKROACH_ENCRYPTION_KEY: ${COCKROACH_ENCRYPTION_KEY:?请在 .env 中设置 Fernet 密钥}
      COCKROACH_ACTIVATION_CODE: ${COCKROACH_ACTIVATION_CODE:?请在 .env 中设置从 Evan 获取的激活码}
      HOME: /data
      XDG_CACHE_HOME: /data/.cache
    user: "${COCKROACH_UID:-10001}:${COCKROACH_GID:-10001}"
    ports:
      - "${COCKROACH_BIND_IP:-127.0.0.1}:${COCKROACH_PORT:-8790}:8790"
    volumes:
      - "${COCKROACH_DATA_DIR:-cockroach-data}:/data"
      - "${COCKROACH_CD2_PATH:-/CloudNAS/miaochuang}:/cd2/miaochuang:ro,rslave"
    security_opt:
      - no-new-privileges:true

volumes:
  cockroach-data:
